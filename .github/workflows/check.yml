name: Build and regression checks
on:
  pull_request:
  push:
    branches: [main, codex/slouch-overhaul]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/verify-build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: slouch-web
          path: dist
